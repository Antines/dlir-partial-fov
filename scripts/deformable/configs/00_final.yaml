# Final model: one shift along the phase-encoding (PE) axis per voxel, canonical orientation, velocity field + scaling
# and squaring. Loss (sqdist) = mean squared distance (mm^2) between the predicted and the true T1 position over the
# scored slab voxels + smooth x mean squared difference of the predicted field between neighbouring voxels. Other
# losses: l1 = mean distance instead of the squared one; mi = minus the mutual information between the slab and the
# shifted T1 (needs no ground truth); sqdist+mi = both.
loss: sqdist        # sqdist | l1 | mi | sqdist+mi (defined in 00_final.yaml)
smooth: 0.1         # weight of the smoothness penalty
output: pe          # pe = one shift along the PE axis; 3d = free 3D shift
canonical: true     # rotate / flip every slab so that PE is the same axis with the same sign
integrate: true     # velocity -> scaling and squaring -> shift; false: the network outputs the shift
width: 1.0          # U-Net channel multiplier (1.0 = 16-32-32-32)
rigid_noise: 0.0    # training only: extra random rigid error of the T1 resampling, up to this many mm and deg
steps: 20000        # training steps, one slab each
lr: 3.0e-4          # Adam learning rate
seed: 0
